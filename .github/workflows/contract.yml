name: contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-app:
    name: build test app (with a static OpenSSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r27c }
      - name: cache test-app dependencies
        uses: actions/cache@v4
        with:
          path: ~/testapp-deps
          key: testapp-deps-openssl-3.4.1-ndk-r27c-v1
      - name: fetch dependencies, build OpenSSL on a cache miss
        run: tools/fetch_testapp_deps.sh ~/testapp-deps --openssl 3.4.1
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: build
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          platform=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          BUILD_TOOLS=$build_tools ANDROID_JAR=$platform/android.jar tests/test-app/build_manual.sh
          test -f tests/test-app/build-manual/lib/arm64-v8a/libtestossl.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          JARS_DIR: /home/runner/testapp-deps
          OPENSSL_DIR: /home/runner/testapp-deps/openssl-3.4.1
      - uses: actions/upload-artifact@v4
        with:
          name: pinning-haters-test-app
          path: tests/test-app/build-manual/app-debug.apk
      # The bundled OpenSSL doubles as a host fixture for the SSL_METHOD locator (3.2+ layout).
      - uses: actions/upload-artifact@v4
        with:
          name: static-openssl-fixture
          path: tests/test-app/build-manual/lib/arm64-v8a/libtestossl.so

  host-tests:
    name: host tests (DEX patcher, GOT rewriter, config, table locators)
    needs: build-test-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: static-openssl-fixture
          path: tools/reference-libs/boringssl-negative
      - name: run
        env:
          CMAKE_GENERATOR: Ninja
        run: tests/run_host_tests.sh   # d8 comes from $ANDROID_HOME/build-tools on the runner

  elf-contracts:
    name: ELF contracts API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: cache reference libraries
        id: cache
        uses: actions/cache@v4
        with:
          path: tools/reference-libs/${{ matrix.api }}
          key: reference-libs-${{ matrix.api }}-v2  # v2: adds libdl.so
      - name: pull reference libraries from the AVD image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y e2fsprogs erofs-utils
          tools/pull_reference_libs.sh ${{ matrix.api }}
      - run: tools/check_elf_contracts.sh ${{ matrix.api }}

  build-module:
    name: build arm64 module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r27c }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: tools/package.sh dev-${GITHUB_SHA::8}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: pinning-haters-module
          path: build/pinning-haters-*.zip
